هذا الملف كامل، انسخه وحطه مكان .github/workflows/android.yml:
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web app
        run: |
          for z in ./*.zip; do unzip -o "$z" -d unz; done
          mkdir www
          cp "$(find unz -name index.html | head -1)" www/index.html
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Arshif Waleed" com.waleed.arshef --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Generate app icon
        run: |
          mkdir -p assets
          cp icon-for-apk.png assets/icon.png
          npx @capacitor/assets@3 generate --android --iconBackgroundColor '#0A84FF' --iconBackgroundColorDark '#0A84FF'
      - name: Build APK (temporary debug key)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arshif-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
ملاحظات:
سطر sed: في الصورة كان مقطوع من الآخر، فكتبته بناءً على الشكل الظاهر (يضيف صلاحية الكاميرا في AndroidManifest.xml). لو الأصلي عندك مختلف، استخدم بتاعك الأصلي مكانه.
الأيقونة: الصورة لازم تفضل في جذر المستودع باسم icon-for-apk.png، وأفضل مقاس لها 1024×1024.
الخلفية الزرقاء: #0A84FF لون تقريبي من الصورة. لو عايز لون أدق، ابعتلي الكود بتاعه أو عدّله بنفسك.
ترتيب الخطوات: خطوة الأيقونة لازم تيجي بعد cap add android وقبل assembleDebug، وده اللي عملته.
